name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test core
        run: dotnet test tests/GameTuner.Core.Tests -c Release --logger "trx;LogFileName=results.trx"

      - name: Build app (x64)
        run: dotnet build src/GameTuner.App -c Release -p:Platform=x64

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
