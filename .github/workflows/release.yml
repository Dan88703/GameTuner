name: Release

# Push a tag like v1.0.0 to build the installer and publish a GitHub release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: version
        shell: pwsh
        run: echo "value=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/GameTuner.Core.Tests -c Release

      - name: Publish (self-contained, x64)
        run: >
          dotnet publish src/GameTuner.App -c Release -r win-x64 --self-contained true
          -p:Platform=x64 -p:Version=${{ steps.version.outputs.value }}
          -o artifacts/publish

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/GameTuner-${{ steps.version.outputs.value }}-win-x64-portable.zip

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.value }}" `
            "/DSourceDir=$PWD\artifacts\publish" `
            "/DOutputDir=$PWD\artifacts" `
            installer\GameTuner.iss

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/GameTuner-*-setup.exe
            artifacts/GameTuner-*-portable.zip
